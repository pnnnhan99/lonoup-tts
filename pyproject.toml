[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lonoup-tts"
version = "0.1.0"
description = "LONOUP-TTS: a Text-to-Speech web application powered by Piper TTS."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["tts", "text-to-speech", "piper", "asr", "speech"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "Flask>=3,<4",
    "gunicorn>=22,<24",
    "requests>=2,<3",
]

[project.optional-dependencies]
upload = ["huggingface_hub>=0.20"]

[tool.setuptools]
packages = ["lonoup_tts"]